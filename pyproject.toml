[project]
name = "gmail-mcp"
version = "0.2.0"
description = "Personal Gmail + Calendar MCP gateway — HTTP, multi-account, Raspberry Pi ready"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.0.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
gmail-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
